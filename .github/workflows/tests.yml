name: tests

on:
  push:
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install --index-url https://download.pytorch.org/whl/cpu torch==2.5.1 torchvision==0.20.1
      - run: pip install -e . --no-deps
      - run: pip install numpy==1.26.4 Pillow==9.5.0 PyYAML==6.0.2 python-dotenv==1.0.1 tiktoken==0.8.0 tqdm==4.66.5 transformers==4.45.2 pytest==8.3.4
      - run: python -m compileall -q src tests scripts
      - run: bash -n scripts/slurm.sh
      - run: pytest
