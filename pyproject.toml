[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mip-against-agent"
version = "0.1.0"
description = "Reproducible malicious image patch crafting for multimodal OS agents"
readme = "README.md"
requires-python = ">=3.11,<3.13"
authors = [{name = "Lukas Aichberger"}]
license = "Apache-2.0 AND MIT AND CC-BY-4.0"
license-files = ["LICENSE", "THIRD_PARTY.md", "third_party/licenses/*.txt"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "accelerate==1.3.0",
  "easyocr==1.7.0",
  "einops==0.8.0",
  "huggingface-hub==0.24.6",
  "numpy==1.26.4",
  "opencv-python-headless==4.10.0.84",
  "Pillow==9.5.0",
  "python-dotenv==1.0.1",
  "PyYAML==6.0.2",
  "requests==2.32.3",
  "safetensors==0.4.5",
  "supervision==0.25.1",
  "tiktoken==0.8.0",
  "torch==2.5.1",
  "torchvision==0.20.1",
  "tqdm==4.66.5",
  "transformers==4.45.2",
  "ultralytics==8.3.63",
]

[project.optional-dependencies]
oss-parser = [
  "addict==2.4.0",
  "matplotlib==3.10.0",
  "pycocotools==2.0.8",
  "pytesseract==0.3.10",
  "timm==1.0.13",
  "yapf==0.43.0",
]
dev = ["pytest==8.3.4"]

[project.scripts]
mip-attack = "mip_attack.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
